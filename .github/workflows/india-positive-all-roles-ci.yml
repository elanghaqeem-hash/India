name: INDIA positive all-role isolated simulation
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/india-positive-role-simulation.mjs'
      - '.github/workflows/india-positive-all-roles-ci.yml'
      - 'tests/**'
      - 'src/**'
      - 'migrations/**'
      - 'docs/INDIA_ERP_UAT_210_CATALOG.json'
      - 'docs/INDIA_UAT_210_CATALOG.json'
permissions:
  contents: read
jobs:
  positive-synthetic-role-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install headless Chromium for localhost-only UI tests
        run: npx playwright install --with-deps chromium
      - name: Verify orchestrator syntax
        run: node --check scripts/india-positive-role-simulation.mjs
      - name: Run role and function technical simulations
        run: node scripts/india-positive-role-simulation.mjs --ci
      - name: Publish non-sensitive technical test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-positive-uat-synthetic
          path: |
            artifacts/india-positive-uat/result.json
            artifacts/india-automated-gate/result.json
            artifacts/browser-uat/*.png
          if-no-files-found: warn
          retention-days: 14
# This CI does not deploy, contact external providers, access remote D1,
# impersonate real users, sign operational approvals or assert 420 business PASS.
