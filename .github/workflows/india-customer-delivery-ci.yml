name: INDIA Customer Delivery Cash Renewal
on:
  push:
    branches: [feat/india-customer-delivery-cash-renewal-20261022]
  pull_request:
    branches: [main, feat/india-modules-13-15-completion-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:consolidation
      - run: npm run build:cf
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - run: npx playwright install --with-deps chromium
      - run: node tests/run-service-browser.cjs
