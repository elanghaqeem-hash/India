name: INDIA ERP WP2 WP5 WP6 WP7 isolated integration
on:
  push:
    branches:
      - 'feat/india-erp-wp2-finance-procurement-cyber-20261030'
  pull_request:
    paths:
      - 'migrations/003*.sql'
      - 'src/lib/erp-core.ts'
      - 'src/app/api/erp/**'
      - 'src/app/erp/**'
      - 'tests/india-erp-foundation.test.cjs'
      - '.github/workflows/india-erp-integration-ci.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  api-d1-isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Isolated persistent SQLite/D1 route integration (synthetic identities)
        run: npm run test:erp
      - name: Existing PSA regression
        run: npm run test:psa-timesheets
      - name: TypeScript contract
        run: npm run typecheck
      - name: Existing navigation and middleware regression
        run: npm run test:menu-approval
