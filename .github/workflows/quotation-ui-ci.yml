name: India ICOP quotation UI validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/india-marketing-sales-consolidation-20261022]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-quotation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Mobile and print regression checks
        run: npm run test:pricing && npm run test:layout && npm run test:boq && npm run test:boq-domain && npm run test:boq-workflow && npm run test:quotation-docx && npm run test:post-po && npm run test:ai && npm run test:sales && npm run test:marketing && npm run test:scoping-upload && npm run test:india-negative && npm run test:runtime-compat
      - name: Marketing Sales consolidation and atomic migration gates
        run: npm run test:consolidation
      - name: Presales Proposal Submission Negotiation PO transaction gates
        run: npm run test:sales-transactions
      - name: TypeScript verification
        run: npm run typecheck
      - name: Next production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Install Chromium for Sales stage-filter UAT
        run: npx playwright install --with-deps chromium
      - name: Browser UAT of all ten Sales stages on Android viewport and desktop
        run: |
          npm run start -- -p 3100 > /tmp/india-stage-filter-uat.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/sales/pipeline > /dev/null; then break; fi
            sleep 2
          done
          if ! curl -fsS http://127.0.0.1:3100/sales/pipeline > /dev/null; then
            cat /tmp/india-stage-filter-uat.log
            exit 1
          fi
          node --test tests/sales-stage-filter-browser.test.cjs
        env:
          NEXT_TELEMETRY_DISABLED: '1'
      - name: Upload stage filter UAT screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: india-stage-filter-browser
          path: artifacts/browser-uat/stage-filter-*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Cloudflare Workers adapter packaging
        run: npx opennextjs-cloudflare build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
