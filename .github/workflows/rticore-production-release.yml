name: RTICORE production release — P0 HARD HOLD

# P0 2026-11-01: deliberately non-deploying until independently certified.
# Manual invocation provides visibility but NEVER writes D1, changes Cloudflare
# Access, uploads production backups, deploys the Worker, or rolls data back.
# Re-enable only via separate reviewed release PR after genuine 420-case UAT,
# independent original restore/recovery, signed evidence, migration collision
# reconciliation with PR #103 and #96, and eight function-owner approvals.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rticore-production-release-hold
  cancel-in-progress: false

jobs:
  release-hold:
    name: P0 fail-closed release containment
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Deny all production mutation until independent certification
        run: |
          echo "::error title=PRODUCTION HOLD::Release blocked: reconcile competing 0040+ migrations from PR #103/#104; complete real signed Cloudflare Access UAT (420 cases), original backup/restore, independent RBAC/SoD signoffs and approved production release receipt. Source CI success is not production approval."
          exit 1
