name: India bootstrap lockfile (feature branch only)

on:
  push:
    branches:
      - feat/p0-india-d1-foundation-20261020

permissions:
  contents: write

jobs:
  commit-lock:
    if: github.repository == 'elanghaqeem-hash/India'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate deterministic npm lockfile without running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this feature branch only
        shell: bash
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m "build: commit verified npm dependency lockfile"
            git push origin "HEAD:feat/p0-india-d1-foundation-20261020"
          fi
